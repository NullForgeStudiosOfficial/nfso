<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Ardron Nexus</title>

    <link rel="icon" type="image/png" href="../UniversalAssets/Favicon.png">

    <link rel="stylesheet" href="style.css?v=1.2">

</head>

<body>

    <div id = StartupBlack></div>

    <div id="BackgroundContainer">
        <div id="MainBackground"></div>

    </div>

    <div id="VoidEyes"></div>

    <div id = "Logo"></div>


    <div id = DoorPage>

        <div id="MainTitle">Welcome to the Nexus of Ardron</div>

        <div id = RealmWindow><div id = DoorRealm></div></div>

        <div class="DoorTitle" id="EimonTitle">Auli</div>
        <div class="DoorTitle" id="ElusiaTitle">Pup</div>
        <div class="DoorTitle" id="GrimloweTitle">Vex</div>
        <div class="DoorTitle" id="SostrumTitle">Special</div>
        <div class="DoorTitle" id="VidulynTitle">AU Wiki</div>
        <div class="DoorTitle" id="YumalonTitle">AU Games</div>
        <div class="DoorTitle" id="IcolassTitle">NFSO Discord</div>
        <div class="DoorTitle" id="VoidTitle">NFSO Twitch</div>

        <div id ="DoorFrame">

            <div id = DoorClosedOpen></div>

            <button class="DoorButton" id="DoorEimon">
                <div class="EimonButton" >
                
                </div>

                <div id = EimonSigil></div>
            
            </button>

            <button class="DoorButton" id="DoorElusia">
                <div class="ElusiaButton" ></div>

                <div id = ElusiaSigil></div>
            </button>

            <button class="DoorButton" id="DoorGrimlowe">
                <div class="GrimloweButton" ></div>

                <div id = GrimloweSigil></div>
            </button>

            <button class="DoorButton" id="DoorSostrum">
                <div class="SostrumButton" ></div>

                <div id = SostrumSigil></div>
            </button>

            <button class="DoorButton" id="DoorVidulyn">
                <div class="VidulynButton" ></div>

                <div id = VidulynSigil></div>
            </button>

            <button class="DoorButton" id="DoorYumalon">
                <div class="YumalonButton" ></div>

                <div id = YumalonSigil></div>
            </button>

            <button class="DoorButton" id="DoorIcolass">
                <div class="IcolassButton" ></div>

                <div id = IcolassSigil></div>
            </button>

            <button class="DoorButton" id="DoorSanctum">
                <div class="SanctumButton"></div>

                <div id = MimicClosed></div>
            </button>

            <button class="DoorButton" id="DoorVoid">
                <div class="VoidButton"></div>

                <div id = VoidSigil></div>
            </button>

        </div>

    </div>
    

    <div id = ExtrasPage>
        <div id = ExtrasNavigationPage>
            <div id="ExtrasButtonBoxFrame">
                <div id = "ExtrasButtonBoxBack"></div>
                <div id="ExtrasButtonBox">
                    

                    <button class="NormalButton" id = ExtrasExitButton>
                            <div class="BackButtonBackground" >
                            </div>

                            <div class ="Words">Back 2 Nexus</div>
                    </button>

                    <button class="NormalButton" id = NESPlusButton>
                            <div class="NormalButtonBackground" >
                            </div>

                            <div class ="Words">NES+</div>
                    </button>

                    <button class="NormalButton" id = RealmQuizButton>
                            <div class="NormalButtonBackground" >
                            </div>

                            <div class ="Words">Realm Quiz</div>
                    </button>

                    <button class="NormalButton" id = StatQuizButton>
                            <div class="NormalButtonBackground" >
                            </div>

                            <div class ="Words">Stat Quiz</div>
                    </button>
                </div>
            </div>

            <div id="ExtrasInfoBox">
                <div id ="ExtrasInfoBoxBack"></div>

                <div id = "ExtrasNESPlusInfoBox">
                    Butts 1
                </div>

                <div id = "ExtrasRealmQuizInfoBox">
                    Butts 2
                </div>

                <div id = "ExtrasStatQuizInfoBox">
                    Butts 3
                </div>

                <button class="NormalButton" id = ExtrasConfirmButton>
                            <div class="NormalButtonBackground" >
                            </div>

                            <div id ="extrasconfirmbuttonwords">Confirm</div>
                </button>
                
            </div>
        </div>
    </div>
        

    <div id ="FullLeftRightTransition"></div>
    <div id ="LeftTransition"></div>
    <div id ="RightTransition"></div>

    <div id = FullBlack2></div>

    <script src="code.js"></script>

</body>




</html>
